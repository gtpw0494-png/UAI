name: bootstrap-v042-source

on:
  push:
    branches:
      - build/v0.34.0-durable-orchestration
    paths:
      - .bootstrap/READY-v042

permissions:
  contents: write

jobs:
  expand-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: build/v0.34.0-durable-orchestration
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Reconstruct sanitized v0.42 source archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .bootstrap -maxdepth 1 -name 'v042-*.b64' | wc -l)" -eq 4
          cat .bootstrap/v042-*.b64 | tr -d '\n\r' | base64 -d > /tmp/uai-v042-source.zip
          unzip -t /tmp/uai-v042-source.zip
      - name: Enforce public-repository privacy boundary
        shell: bash
        run: |
          set -euo pipefail
          if unzip -Z1 /tmp/uai-v042-source.zip | grep -E '^(state/|data/|model/checkpoints/|model/runs/|model/tokenizers/|vendor-data/|vendor-reference/|\.env)'; then
            echo "Blocked: sanitized archive contains a private/runtime path."
            exit 1
          fi
      - name: Expand complete source checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/uai-source
          mkdir -p /tmp/uai-source
          unzip -q /tmp/uai-v042-source.zip -d /tmp/uai-source
          rsync -a --delete --exclude='.git/' --exclude='.bootstrap/' /tmp/uai-source/ ./
      - name: Validate source checkpoint
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run test:security
          python3 -m compileall -q model research storage scripts
          python3 model/tokenizer.py status
          python3 model/adaptation.py status
      - name: Remove bootstrap payload and commit validated source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-v036.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "chore: synchronize sanitized v0.42.0 source checkpoint"
          git push origin HEAD:build/v0.34.0-durable-orchestration
