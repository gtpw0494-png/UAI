name: Build 4H3 Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - 4h3-apk-v3.3
    paths:
      - '4h3/apk-source/**'
      - '.github/workflows/build-4h3-apk.yml'
  pull_request:
    paths:
      - '4h3/apk-source/**'
      - '.github/workflows/build-4h3-apk.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and verify 4H3 Android source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/4h3"
          cat 4h3/apk-source/chunks/part-*.b64 > "$RUNNER_TEMP/4h3-source.b64"
          base64 -d "$RUNNER_TEMP/4h3-source.b64" > "$RUNNER_TEMP/4h3-source.zip"
          echo "51b78a1c424d6a2e6816615f191f73f247acf4df88f6a969fcd244ab67028ee9  $RUNNER_TEMP/4h3-source.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/4h3-source.zip" -d "$RUNNER_TEMP/4h3"
          test -f "$RUNNER_TEMP/4h3/native-android/settings.gradle"
          test -f "$RUNNER_TEMP/4h3/native-android/app/src/main/AndroidManifest.xml"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ runner.temp }}/4h3/native-android
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          APK="$RUNNER_TEMP/4h3/native-android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 4H3-v3.3-debug-apk
          path: ${{ runner.temp }}/4h3/native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
